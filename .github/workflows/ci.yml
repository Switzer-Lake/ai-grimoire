name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8"
      - run: python scripts/build.py --check
      - run: python -m pytest -q

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: grimoire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: grimoire
          MYSQL_DATABASE: grimoire
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -pgrimoire" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AI_GRIMOIRE_TEST_PG_DSN: postgresql://postgres:grimoire@localhost:5432/postgres
      AI_GRIMOIRE_TEST_MYSQL_DSN: mysql://root:grimoire@127.0.0.1:3306/grimoire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "pytest>=8" "psycopg[binary]>=3.1" "PyMySQL>=1.1"
      - run: python -m pytest tests/test_store_contract.py -v -rs
